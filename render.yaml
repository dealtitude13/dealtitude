# Render blueprint for the Dealtitude API.
#
# Point Render at this repo and it reads this file: a web service and a
# Postgres database, wired together, with the secrets left blank for you to
# paste in. Nothing here needs editing before the first deploy.
services:
  - type: web
    name: dealtitude-api
    runtime: node
    plan: starter            # free tier sleeps after 15 min; a sleeping API
                             # means a shopper's follow silently fails, so this
                             # is the one place not to economise
    region: ohio
    buildCommand: npm ci --omit=dev
    # Schema first, every boot. It is idempotent, so this can never half-apply.
    startCommand: node src/migrate.js && node src/server.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dealtitude-db
          property: connectionString

      # Web Push. Generate once with `npm run keys` and paste both in.
      # NEVER regenerate these: new keys silently break every phone that has
      # already subscribed, and those people simply stop hearing anything.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@dealtitude.com

      # Apple push, for the App Store build. Leave blank until there is an
      # iPhone app; /v1/health reports which routes are actually live.
      # The .p8 key downloads ONCE from the Developer portal — keep a copy.
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_P8
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.dealtitude.app

      # Google push, for the Play Store build. The whole service-account JSON
      # from the Firebase console, pasted as one value.
      - key: FCM_SERVICE_ACCOUNT
        sync: false

      # Where the app lives. Sign-in links are built from this, so a wrong
      # value produces links that land nowhere.
      - key: APP_URL
        value: https://dealtitude.com
      - key: ALLOWED_ORIGINS
        value: https://dealtitude.com,https://www.dealtitude.com

      # App Store review sign-in. One address, one fixed code, handed to Apple
      # in the review notes because a reviewer has no inbox of ours. Blank =
      # the route does not exist. Invite that address to a demo shop only.
      - key: REVIEW_EMAIL
        sync: false
      - key: REVIEW_CODE
        sync: false

      # Operator key for the admin routes. Long and random.
      - key: ADMIN_KEY
        generateValue: true

      # Mail. Leave unset and sign-in links are written to the service log
      # instead, which is enough to run a pilot by hand.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Dealtitude <hello@dealtitude.com>

databases:
  - name: dealtitude-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
